name: Fork Docker image

# Fork-only. Tags look like `3.13.1-ws42` (upstream version, then the fork build
# number). No `v` prefix, so upstream's release.yml (`v*`) and
# docker-publish.yml (`v*.*.*`) do not start and fail on missing secrets.
on:
  push:
    tags: ["*-ws*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wealthfolio

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wealthfolio-smoke:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Smoke test
        run: python3 .github/scripts/encryption_smoke.py --image wealthfolio-smoke:ci
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push per-arch image
        if: github.ref_type == 'tag'
        run: |
          docker tag wealthfolio-smoke:ci "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"
          docker push "$IMAGE:${{ github.ref_name }}-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tag and latest
        run: |
          for tag in "${{ github.ref_name }}" latest; do
            docker buildx imagetools create --tag "$IMAGE:$tag" \
              "$IMAGE:${{ github.ref_name }}-amd64" "$IMAGE:${{ github.ref_name }}-arm64"
          done
